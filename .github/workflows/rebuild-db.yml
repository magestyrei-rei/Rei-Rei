name: Rebuild football.db from HTML

# Quando n8n (o chiunque) modifica i file HTML in data/, rigenera
# football.db.gz e committalo. Il commit del .gz fa poi scattare deploy.yml
# (che è in paths-ignore: data/**, quindi NON parte sul commit degli HTML).

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-db
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild football.db.gz from data/*.html
        run: python3 scripts/rebuild_from_html.py

      - name: Commit updated football.db.gz
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add football.db.gz
          git diff --staged --quiet || (git commit -m "chore: rebuild football.db.gz from data/" && git pull --rebase origin main && git push)
