name: Predictions Logger Tick

# Ogni 5 minuti genera+logga server-side le predizioni di tutte le partite live
# (1° gol entro 16', leghe monitorate) via /api/ml-live-picks-all -> ml_picks_log su Turso.
# Cosi' le predizioni vengono catturate H24 indipendentemente dal browser/telefono.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Genera e logga le predizioni live
        run: |
          set -e
          URL="https://rei-rei.onrender.com/api/ml-live-picks-all"
          # Render free puo' essere in cold-start (fino ~50s): retry + timeout ampio
          RESPONSE=$(curl -fsSL --max-time 170 --retry 3 --retry-delay 12 "$URL")
          echo "Risposta (estratto):"
          echo "$RESPONSE" | head -c 600
