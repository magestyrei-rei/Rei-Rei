name: Deploy to Render
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -s -X POST "$RENDER_HOOK"
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
